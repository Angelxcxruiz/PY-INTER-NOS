<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c2b">
  <link rel="icon" type="image/svg+xml" href="/app/static/favicon.svg">
  <title>{% block titulo %}{{ titulo_app }}{% endblock %}</title>
  <link rel="stylesheet" href="/app/static/estilos.css?v={{ version }}">
</head>
<body class="{% block clase_body %}{% endblock %}">
  {% block cuerpo %}{% endblock %}

  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <script src="/app/static/ui.js?v={{ version }}"></script>
  <script src="/app/static/api.js?v={{ version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
