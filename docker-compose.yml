services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://inter_nos:inter_nos@db:3306/inter_nos?charset=utf8mb4
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "scripts/start_api.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://inter_nos:inter_nos@db:3306/inter_nos?charset=utf8mb4
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "scripts/run_worker.py"]

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: inter_nos
      MYSQL_USER: inter_nos
      MYSQL_PASSWORD: inter_nos
      MYSQL_ROOT_PASSWORD: root
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-time-zone=+00:00"
      # Los triggers y procedimientos (migración 0012) los crea un usuario sin SUPER.
      - "--log-bin-trust-function-creators=1"
    ports:
     - "3308:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-test:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: inter_nos_test
      MYSQL_USER: inter_nos_test
      MYSQL_PASSWORD: inter_nos_test
      MYSQL_ROOT_PASSWORD: root
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-time-zone=+00:00"
      - "--log-bin-trust-function-creators=1"
    ports:
      - "3307:3306"
    volumes:
      - db-test-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
  db-test-data:
