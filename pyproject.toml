[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inter-nos"
version = "0.1.0"
description = "Backend del simulador académico Inter Nos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymysql>=1.1,<2",
    "cryptography>=44,<46",
    "argon2-cffi>=23,<25",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "email-validator>=2.2,<3",
    "jinja2>=3.1,<4",
    "apscheduler>=3.11,<4",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "httpx>=0.28,<1",
]
quality = [
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "integracion: prueba contra MySQL real (triggers, vistas y migraciones)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"app/modules/*/router.py" = ["B008"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
